<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach Sprint — assistant sport</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1><span id="persona-emoji" aria-hidden="true">🏃</span> <span id="persona-nom">Coach Sprint</span></h1>
    <p>Assistant fictif pour tes séances de sport de loisir. Réponses à règles.</p>
  </header>
  <main>
    <section aria-labelledby="titre-chat">
      <h2 id="titre-chat">Discussion</h2>
      <p id="accueil"></p>
      <div id="suggestions" role="group" aria-label="Questions suggérées"></div>
      <ul id="messages" aria-live="polite" aria-label="Messages"></ul>
      <form id="chat-form">
        <label for="message">Votre message (280 caractères maximum)</label>
        <textarea id="message" name="message" rows="3" maxlength="280" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
      <p id="status" role="status"></p>
      <button type="button" id="effacer">Effacer la conversation</button>
    </section>
  </main>
  <footer>
    <p>Serveur local fourni pour l’atelier. <span id="version">version…</span></p>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
